name: Deploy on live

on:
  push:
    branches:
      - live

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH copy overwrites only transferred files; does not wipe the target folder.
      # Excludes keep existing server dirs (Uploads, node_modules, certs) untouched.
      - name: Sync files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER }}
          username: ${{ vars.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          source: ".,!.git,!.github,!node_modules,!Uploads,!certs,!.env,!*.zip,!*.log"
          target: ./public_html/${{ vars.SERVER_DIR }}/
          overwrite: true
          rm: false

      - name: Install deps and restart PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ vars.SERVER }}
          username: ${{ vars.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            cd ./public_html/${{ vars.SERVER_DIR }}/
            npm install --legacy-peer-deps
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    environment: live
    needs: deploy
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          url: ${{ vars.DEPLOYMENT_URL }}
          follow-redirect: false
          max-attempts: 3
          retry-delay: 5s
          retry-all: false
