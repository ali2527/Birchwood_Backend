name: Deploy on live

on:
  push:
    branches:
      - live

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Overwrites code files only; does not wipe the target folder.
      # Existing server dirs (Uploads, node_modules, certs, .env) stay untouched.
      - name: Sync files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER }}
          username: ${{ vars.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          source: ".,!.git,!.github,!node_modules,!Uploads,!certs,!.env,!*.zip,!*.log"
          target: ./public_html/${{ vars.SERVER_DIR }}/
          overwrite: true
          rm: false

      - name: Install deps and restart PM2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ vars.SERVER }}
          username: ${{ vars.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ./public_html/${{ vars.SERVER_DIR }}/
            npm install --legacy-peer-deps
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
            sleep 3
            pm2 status
            if ! curl -fsS "http://127.0.0.1:8201/api/health"; then
              echo "App not healthy on :8201 — recent logs:"
              pm2 logs birchwood-backend --lines 80 --nostream || true
              exit 1
            fi
            echo
            echo "Local health check OK"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    environment: live
    needs: deploy
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v4
        with:
          # Set DEPLOYMENT_URL to https://api.thebirchwoodacademy.com/api/health
          url: ${{ vars.DEPLOYMENT_URL }}
          follow-redirect: true
          max-attempts: 8
          retry-delay: 10s
          retry-all: true
